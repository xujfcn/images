  </defs>
  <line x1="152" y1="330" x2="1048" y2="330" stroke="#2f80a7" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="Inter, Arial, sans-serif">
    <g>
      <circle cx="180" cy="330" r="18" fill="#2f80a7"/>
